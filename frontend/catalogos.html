<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catálogos Cadastrados</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Nosso CSS -->
    <link rel="stylesheet" href="/frontend/css/estilo.css">
</head>

<body>

    <!-- MENU -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary shadow">
        <div class="container">
            <a class="navbar-brand fw-bold" href="/">
                Biblioteca Digital
            </a>
            <div>
                <a href="/" class="btn btn-light btn-sm">
                    Início
                </a>
                <a href="/frontend/cadastro_catalogo.html" class="btn btn-light btn-sm">
                    Novo catálogo
                </a>
            </div>
        </div>
    </nav>

    <!-- CONTEÚDO -->
    <main class="container py-5">

        <div class="d-flex justify-content-between align-items-center mb-4">
            <div>
                <h1 class="fw-bold mb-1">
                    Catálogos Cadastrados
                </h1>
                <p class="text-muted mb-0">
                    Consulte e pesquise os catálogos cadastrados no sistema.
                </p>
            </div>
        </div>

        <!-- FILTRO -->
        <div class="card shadow-sm border-0 mb-4">
            <div class="card-body">
                <h5 class="card-title fw-bold mb-3">
                    🔎 Filtrar catálogos
                </h5>

                <div class="row g-3 align-items-end">
                    <div class="col-md-3">
                        <label for="campoFiltro" class="form-label">
                            Filtrar por
                        </label>
                        <select id="campoFiltro" class="form-select">
                            <option value="nome">Nome</option>
                            <option value="id_catag">Código (ID)</option>
                            <option value="ebooks_ids">IDs dos E-Books</option>
                            <option value="descricao">Descrição</option>
                        </select>
                    </div>

                    <div class="col-md-7">
                        <label for="textoFiltro" class="form-label">
                            Pesquisar
                        </label>
                        <input type="text" id="textoFiltro" class="form-control" placeholder="Digite o termo para pesquisar...">
                    </div>

                    <div class="col-md-2">
                        <button type="button" id="btnLimparFiltro" class="btn btn-secondary w-100">
                            Limpar
                        </button>
                    </div>
                </div>
            </div>
        </div>

        <!-- TABELA -->
        <div class="card shadow-sm border-0">
            <div class="card-body">
                <div class="table-responsive">
                    <table class="table table-hover table-striped align-middle">
                        <thead class="table-primary">
                            <tr>
                                <th>Código</th>
                                <th>Nome</th>
                                <th>Descrição</th>
                                <th>E-Books Incluídos</th>
                                <th>Ações</th>
                            </tr>
                        </thead>
                        <tbody id="listaCatalogos">
                            <!-- Preenchido dinamicamente via JS -->
                        </tbody>
                    </table>
                </div>
            </div>
        </div>

    </main>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <!-- JavaScript do projeto -->
    <script src="/frontend/js/catalogo.js"></script>

</body>

</html>
