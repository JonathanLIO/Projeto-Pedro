<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro de Bibliotecário</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Nosso CSS -->
    <link rel="stylesheet" href="/frontend/css/estilo.css">
</head>

<body>

    <!-- MENU -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary shadow">
        <div class="container">
            <a class="navbar-brand fw-bold" href="/">
                Biblioteca Digital
            </a>
            <div>
                <a href="/frontend/bibliotecarios.html" class="btn btn-light btn-sm">
                    Ver todos os bibliotecários
                </a>
            </div>
        </div>
    </nav>

    <!-- CONTEÚDO -->
    <main class="container py-5">

        <div class="row justify-content-center">
            <div class="col-md-8 col-lg-6">

                <div class="card shadow-sm border-0">
                    <div class="card-body p-4">

                        <h1 id="tituloFormulario" class="h3 fw-bold mb-3">
                            Cadastrar Bibliotecário
                        </h1>

                        <!-- Mensagem de Sucesso ou Erro -->
                        <div id="mensagem" class="fw-bold mb-3 text-primary"></div>

                        <form id="form-bibliotecario">
                            <div class="mb-3">
                                <label for="user_id" class="form-label fw-semibold">
                                    Usuário do Sistema
                                </label>
                                <select id="user_id" class="form-select" required>
                                    <option value="">Carregando usuários...</option>
                                    <!-- Preenchido dinamicamente via JS -->
                                </select>
                            </div>

                            <div class="mb-4">
                                <label for="matricula" class="form-label fw-semibold">
                                    Matrícula
                                </label>
                                <input type="text" id="matricula" class="form-control" placeholder="Digite a matrícula do bibliotecário" required>
                            </div>

                            <div class="d-flex gap-2">
                                <button type="submit" id="btnSalvar" class="btn btn-primary w-100">
                                    Cadastrar
                                </button>
                                <a href="/frontend/bibliotecarios.html" class="btn btn-outline-secondary w-100">
                                    Cancelar
                                </a>
                            </div>
                        </form>

                    </div>
                </div>

            </div>
        </div>

    </main>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <!-- JavaScript do projeto -->
    <script src="/frontend/js/bibliotecario.js"></script>

</body>

</html>
