<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro de Progresso</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/frontend/css/estilo.css">
</head>
<body>

    <nav class="navbar navbar-dark bg-primary shadow">
        <div class="container">
            <a class="navbar-brand fw-bold" href="/">
                Gestão Escolar
            </a>
            <a href="/frontend/progresso.html" class="btn btn-light btn-sm">
                Ver progressos
            </a>
        </div>
    </nav>

    <main class="container py-5">
        <div class="row justify-content-center">
            <div class="col-lg-8">
                <div class="card shadow border-0">
                    <div class="card-body p-4 p-md-5">

                        <h1 id="tituloFormulario" class="fw-bold mb-1">
                            Cadastrar Progresso
                        </h1>

                        <p class="text-muted mb-4">
                            Preencha os dados do progresso de leitura.
                        </p>

                        <div id="mensagem" class="mb-3"></div>

                        <form id="form-progresso">
                            <div class="row g-3">

                                <div class="col-md-6">
                                    <label for="user_id" class="form-label">
                                        Usuário
                                    </label>
                                    <select id="user_id" class="form-select" required>
                                        <option value="">Carregando usuários...</option>
                                    </select>
                                </div>

                                <div class="col-md-6">
                                    <label for="ebook_id" class="form-label">
                                        E-Book
                                    </label>
                                    <select id="ebook_id" class="form-select" required>
                                        <option value="">Carregando e-books...</option>
                                    </select>
                                </div>

                                <div class="col-md-6">
                                    <label for="pagina_lidas" class="form-label">
                                        Quantidade de páginas lidas
                                    </label>
                                    <input type="number" id="pagina_lidas" class="form-control" min="0" placeholder="Ex: 50" required>
                                </div>

                                <div class="col-md-6">
                                    <label for="atualizacao" class="form-label">
                                        Data de Atualização
                                    </label>
                                    <input type="date" id="atualizacao" class="form-control" required>
                                </div>

                            </div>

                            <div class="d-flex gap-2 mt-4">
                                <button type="submit" class="btn btn-primary" id="btnSalvar">
                                    Cadastrar
                                </button>

                                <a href="/" class="btn btn-outline-secondary">
                                    Cancelar
                                </a>

                                <a href="/frontend/progresso.html" class="btn btn-outline-secondary">
                                    Voltar
                                </a>
                            </div>
                        </form>

                    </div>
                </div>
            </div>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/frontend/js/progresso.js"></script>
</body>
</html>
